name: build

# 产物只在打 tag 时发布；平时推代码只跑检查，不浪费构建时间。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "手动构建的版本号（仅用于产物命名，不创建 Release）"
        required: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------ macOS
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 只构建 Apple Silicon。Intel runner（macos-13）已被 GitHub 列入退役计划，
        # 放进矩阵会让整个发布流程因「runner 不存在」而失败。
        # 需要 Intel 包时：本地在 Intel Mac 上跑 packages/macos/build.sh，
        # 或把下面的注释项解开并确认该 runner 仍然可用。
        include:
          - runner: macos-latest  # Apple Silicon，跟随当前受支持镜像
            arch: arm64
          # - runner: macos-13      # Intel（退役中，谨慎启用）
          #   arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements-dev.txt

      - name: 语法检查
        run: python -m compileall -q moshan

      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --clean --distpath dist --workpath build packages/moshan.spec
          # 打包瞬间的文件清单。冒烟跑完拿它 diff，凡是新增的都算「运行期写进了 bundle」——
          # 这类文件会让代码签名 seal 失效，用户下载后就是「已损坏，移到废纸篓」。
          find dist/Moshan.app -type f -not -path "*/_CodeSignature/*" | sort > "$RUNNER_TEMP/bundle-before.txt"

      # 这一步是本仓库唯一能验证「装到别人机器上到底能不能用」的地方。
      # 0.2.0 就是因为 CI 只构建、从不运行才发出去的：包里自带 OpenSSL 找不到
      # 系统 CA，安装版所有 https（含「检查更新」）全废，而构建日志一切正常。
      # 构建能过 ≠ 装完能跑，所以这里真的把 app 拉起来打一次接口。
      - name: 冒烟（安装版能起来 / 证书打进去了）
        run: |
          TMPH=$(mktemp -d); TMPM=$(mktemp -d)
          HOME="$TMPH" MOSHAN_HOME="$TMPM" MOSHAN_NO_BROWSER=1 \
            ./dist/Moshan.app/Contents/MacOS/Moshan >/dev/null 2>&1 &
          APP=$!
          trap 'kill $APP 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            [ -f "$TMPM/state/config.json" ] && break
            sleep 1
          done
          LOG="$TMPM/state/logs/moshan.log"
          echo "--- 启动日志 ---"; cat "$LOG" 2>/dev/null || true

          if ! grep -q "CA 证书：/" "$LOG" 2>/dev/null; then
            echo "::error::安装版没找到 CA 证书，所有 https 请求都会 CERTIFICATE_VERIFY_FAILED"
            exit 1
          fi

          P=$(python3 -c "import json;print(json.load(open('$TMPM/state/config.json'))['local_port'])")
          K=$(python3 -c "import json;print(json.load(open('$TMPM/state/config.json'))['token'])")
          CODE=000
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 3 -H "X-Token: $K" \
                     "http://127.0.0.1:$P/api/about" || true)
            [ "$CODE" = "200" ] && break
            sleep 1
          done
          echo "GET /api/about -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::安装版启动后接口不可用（进程起来不等于服务能响应）"
            exit 1
          fi
          echo "安装版冒烟通过：证书在位、服务可响应"

      - name: 检查冒烟没把数据写进 bundle
        run: |
          find dist/Moshan.app -type f -not -path "*/_CodeSignature/*" | sort > "$RUNNER_TEMP/bundle-after.txt"
          NEW=$(comm -13 "$RUNNER_TEMP/bundle-before.txt" "$RUNNER_TEMP/bundle-after.txt")
          if [ -n "${NEW}" ]; then
            echo "::error::运行时往 .app 内部写了文件，代码签名 seal 必然失效（0.3.4 装不上就是这个）："
            echo "${NEW}"
            echo "修法：写数据一律走 paths.base_dir()，不要用 Path(__file__).parent 拼路径"
            exit 1
          fi
          echo "bundle 未被运行期污染"

      - name: 清理 exFAT 元数据
        run: |
          # macOS 在 exFAT/网络卷上会往文件旁边撒 ._xxx，codesign 会把它当子组件
          # 去签，然后报 Operation not permitted 整包失败。GitHub runner 是 APFS，
          # 这里纯属兜底（本地在移动硬盘上构建时一定会遇到）。
          n=$(find dist/Moshan.app -name "._*" | wc -l | tr -d ' ')
          if [ "${n}" -gt 0 ]; then
            find dist/Moshan.app -name "._*" -delete
            echo "清掉 ${n} 个 ._ 元数据文件"
          fi

      - name: ad-hoc 签名（失败即红）
        run: |
          # 不能带 `|| true`：签名失败还照发的话，用户双击看到的是
          # 「Moshan.app 已损坏，你应该将它移到废纸篓」—— 0.3.4 就是这么翻车的。
          codesign --force --deep --sign - dist/Moshan.app
          codesign --verify --deep --strict --verbose=2 dist/Moshan.app

      - name: 读取版本
        id: ver
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' moshan/version.py | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 制作 dmg
        run: |
          V="${{ steps.ver.outputs.version }}"
          STAGE=$(mktemp -d)
          # 必须用 ditto：cp -R 会跟随符号链接（这个 bundle 里有十几个）、丢扩展属性，
          # 复制出来的 app 签名当场失效。ditto 是 macOS 上复制 bundle 的正确方式。
          ditto dist/Moshan.app "$STAGE/Moshan.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Moshan ${V}" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/Moshan-${V}-macos-${{ matrix.arch }}.dmg"
          rm -rf "$STAGE"
          shasum -a 256 "dist/Moshan-${V}-macos-${{ matrix.arch }}.dmg" | awk '{print $1}' > "dist/dmg.sha256"
          cat "dist/dmg.sha256"

      - name: 从 dmg 里反向校验签名（用户拿到的就是这个）
        run: |
          V="${{ steps.ver.outputs.version }}"
          DMG="dist/Moshan-${V}-macos-${{ matrix.arch }}.dmg"
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          codesign --verify --deep --strict --verbose=2 "$MNT/Moshan.app"
          echo "dmg 里的 app 签名完好"
          hdiutil detach "$MNT" >/dev/null 2>&1 || true

      - name: 制作 zip（应用内更新读的就是这一份）
        # dmg 给人手动装；zip 给程序自己更新用。应用内更新拿到 zip 才能解压替换
        # 自己的 .app，不必让人重新拖一次图标。`ditto -c -k --keepParent` 是唯一
        # 能保住签名、符号链接与扩展属性的打法（zip(1) 会把符号链接存成普通文件，
        # 解出来签名当场坏掉）。
        run: |
          V="${{ steps.ver.outputs.version }}"
          ZIP="dist/Moshan-${V}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent dist/Moshan.app "$ZIP"
          shasum -a 256 "$ZIP" | awk '{print $1}' > "dist/zip.sha256"
          ls -lh "$ZIP"

      - name: 从 zip 里反向校验签名（应用内更新装上去的就是这个）
        run: |
          V="${{ steps.ver.outputs.version }}"
          ZIP="dist/Moshan-${V}-macos-${{ matrix.arch }}.zip"
          T=$(mktemp -d)
          ditto -xk "$ZIP" "$T"
          codesign --verify --deep --strict --verbose=2 "$T/Moshan.app"
          test -f "$T/Moshan.app/Contents/Resources/dash.html" \
            || { echo "zip 里没有 dash.html，中台页面会 404"; exit 1; }
          echo "zip 里的 app 签名完好，且带着中台页面"
          rm -rf "$T"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: moshan-macos-${{ matrix.arch }}
          path: |
            dist/Moshan-*-macos-${{ matrix.arch }}.dmg
            dist/Moshan-*-macos-${{ matrix.arch }}.zip
            dist/dmg.sha256
            dist/zip.sha256
          if-no-files-found: error

  # ------------------------------------------------------------ Windows
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 构建（含安装程序）
        shell: pwsh
        run: |
          $env:ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          ./packages/windows/build.ps1

      # 与 macOS 那边同一件事：把刚打出来的 exe 真跑一次。
      # Windows 上同样是自带 OpenSSL 找不到系统根证书，只构建不运行就发现不了。
      - name: 冒烟（安装版能起来 / 证书打进去了）
        shell: pwsh
        run: |
          $home2 = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "mhome")
          $state = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "mstate")
          $exe = Get-ChildItem dist -Recurse -Filter Moshan.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "找不到 Moshan.exe"; exit 1 }
          Write-Host "启动 $($exe.FullName)"

          $env:HOME = $home2.FullName
          $env:MOSHAN_HOME = $state.FullName
          $env:MOSHAN_NO_BROWSER = "1"
          $p = Start-Process -FilePath $exe.FullName -PassThru -WindowStyle Hidden

          $cfg = Join-Path $state.FullName "state\config.json"
          $log = Join-Path $state.FullName "state\logs\moshan.log"

          function Show-Diag {
            Write-Host "===== 启动日志（全量） ====="
            if (Test-Path $log) { Get-Content $log } else { Write-Host "(日志文件不存在：$log)" }
            Write-Host "===== config.json ====="
            if (Test-Path $cfg) { Get-Content $cfg -Raw } else { Write-Host "(不存在)" }
            Write-Host "===== 本进程监听端口 ====="
            netstat -ano | Select-String "LISTENING" | Select-String "\s$($p.Id)$"
            Write-Host "===== 进程状态 ====="
            $p.Refresh()
            if ($p.HasExited) { Write-Host "已退出，ExitCode=$($p.ExitCode)" } else { Write-Host "仍在运行 PID=$($p.Id)" }
          }

          # 判据：以「程序自己打印出来的那个本机地址」为准。launcher 就是把用户领到
          # 这个地址的，它不会响就等于用户装完打不开 —— 比猜某个固定端口可靠。
          $lport = $null
          for ($i = 0; $i -lt 60; $i++) {
            if (Test-Path $log) {
              $m = Select-String -Path $log -Pattern "口袋服务 http://127\.0\.0\.1:(\d+)" | Select-Object -First 1
              if ($m) { $lport = $m.Matches[0].Groups[1].Value; break }
            }
            $p.Refresh(); if ($p.HasExited) { break }
            Start-Sleep 1
          }

          if (-not $lport) {
            Show-Diag
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Error "安装版没起来（六十秒内没打印出本机访问地址）"
            exit 1
          }
          Write-Host "程序自报本机端口：$lport"

          if (-not (Select-String -Path $log -Pattern "CA 证书：." -Quiet)) {
            Show-Diag
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Error "安装版没找到 CA 证书，https 会 CERTIFICATE_VERIFY_FAILED"
            exit 1
          }

          $j = Get-Content $cfg -Raw | ConvertFrom-Json
          $url = "http://127.0.0.1:$lport/api/about"
          $code = "000"
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -Headers @{ "X-Token" = $j.token } -TimeoutSec 3 -UseBasicParsing
              $code = "$($r.StatusCode)"; if ($code -eq "200") { break }
            } catch { $code = "err" }
            Start-Sleep 1
          }
          Write-Host "GET $url -> $code"
          if ($code -ne "200") {
            Show-Diag
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Error "安装版启动后接口不可用"
            exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "安装版冒烟通过"

      - name: 输出校验值
        shell: pwsh
        run: |
          $f = Get-ChildItem dist\*-windows-x64-Setup.exe | Select-Object -First 1
          (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii dist\setup.sha256
          Get-Content dist\setup.sha256

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: moshan-windows-x64
          path: |
            dist/*-windows-x64-Setup.exe
            dist/setup.sha256
          if-no-files-found: error

  # ------------------------------------------------------------ Release
  release:
    name: 发布 Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成 release.json（供人工核对校验值）
        # 更新器不读这个文件 —— 它读 GitHub Releases API，校验值取每个资产的
        # digest 字段（与这里的 sha256 同源同值）。release.json 的作用是给
        # 「手动下载后想核对」的人一个稳定位置，不依赖 API 的字段变化。
        # 单独再发一个 dmg.sha256 附件没有意义，只会让 Release 目录更乱。
        run: |
          V="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path("artifacts")
          assets = {}
          for f in sorted(root.iterdir()):
              if not f.is_file():
                  continue
              low = f.name.lower()
              if low.endswith(".dmg"):
                  key = "macos-arm64" if "arm64" in low else "macos-x64"
              elif low.endswith(".exe"):
                  key = "windows-x64"
              else:
                  continue
              assets[key] = {
                  "name": f.name,
                  "size": f.stat().st_size,
                  "sha256": hashlib.sha256(f.read_bytes()).hexdigest(),
              }
          out = {
              # 存不带 v 的版本号：写 v0.2.0 的话，谁拿它跟 version.VERSION 比都会出岔子
              "version": os.environ["VERSION"].strip().lstrip("vV"),
              "min_from": "0.1.0",
              "assets": assets,
              "notes": "见 Release 说明",
          }
          pathlib.Path("artifacts/release.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
        env:
          VERSION: ${{ github.ref_name }}

      - name: 从 CHANGELOG 生出这份 Release 的正文
        # 以前 Release 正文只有一套固定的「安装」模板，更新内容靠 GitHub 从
        # commit 里自动生成 —— 读者看到的是一串「fix(push): ...」，不是人话。
        # 现在改成把 CHANGELOG.md 里对应版本那一节直接搬到正文顶部：
        # 写代码的人写一次，发版时不用再手工贴一遍，也不会漏。
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          ver = os.environ["VERSION"].strip().lstrip("vV")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # 认 `## [0.2.5] - 2026-11-23` 这种标题，取到下一个 `## ` 之前
          pat = re.compile(r"^##\s*\[" + re.escape(ver) + r"\][^\n]*\n(.*?)(?=^##\s)",
                           re.M | re.S)
          m = pat.search(text)
          notes = (m.group(1).strip() if m
                   else "> CHANGELOG.md 里没有 `" + ver + "` 这一节，请补上。")
          install = """
          ---

          ## 安装

          下载与你的系统对应的文件：

          | 系统 | 文件 |
          |---|---|
          | macOS（Apple 芯片 M1/M2/M3/M4） | `Moshan-*-macos-arm64.dmg` |
          | macOS（Intel） | `Moshan-*-macos-x64.dmg` |
          | Windows 10/11 64 位 | `Moshan-*-windows-x64-Setup.exe` |

          **从 0.3.8 起可以在软件里点「立即更新并重启」**，不必再来这里下载：
          程序会自己取同版本的 `Moshan-*-macos-*.zip`（dmg 旁边那份，签名在里面）、
          校验、替换自己再打开。手动装仍然用 dmg，两者内容一致。

          **macOS 首次打开会弹一次「无法打开 Moshan.app，因为 Apple 无法检查其是否包含恶意软件」
          —— 这是正常的，不是包坏了。**
          安装包用的是 ad-hoc 签名（`codesign --sign -`）：能保证包内文件完整、不被篡改
          （所以不会出现「已损坏，应移到废纸篓」），但它没有 Apple 开发者身份、也没做公证，
          macOS 对这类应用一律拦一次。

          先把 `Moshan.app` 拖进「应用程序」，然后任选一种放行：

          1. 终端一行（最快）：`xattr -dr com.apple.quarantine /Applications/Moshan.app`，
             之后正常双击即可；
          2. 双击后点「好」→「系统设置 → 隐私与安全性」→ 滚到底部 →「仍要打开」→
             再双击一次，选「打开」；
          3. 「访达」里右键点 Moshan → 打开。

          **只需放行一次**：0.3.8 起更新由程序自己的 helper 替换，替换后自动清掉 quarantine，
          以后的新版本不再弹。**不要在 dmg 挂载卷或下载目录里直接双击运行** —— 会被挂到
          AppTranslocation 临时路径，既不能原地更新，放行也失效。

          **更新不会丢数据**：程序装在应用目录，你的配置在
          `~/Library/Application Support/Moshan`（Windows 在 `%APPDATA%\\Moshan`），
          文件在 `~/Documents/Moshan`。覆盖安装只替换程序，另两个目录不动。

          ### 校验
          `release.json` 里有每个包的 sha256，可用 `shasum -a 256 <文件>` 核对。
          """
          pathlib.Path("notes.md").write_text(notes + "\n" + install, encoding="utf-8")
          print(notes)
          PY
        env:
          VERSION: ${{ github.ref_name }}

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/release.json
          draft: false
          # generate_release_notes 会在正文后面再补一段「提交清单 + Full Changelog」
          # 对比链接。清单本身没什么可读性，但那条对比链接是查证用的，留着。
          generate_release_notes: true
          body_path: notes.md
