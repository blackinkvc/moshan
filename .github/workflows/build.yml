name: build

# 产物只在打 tag 时发布；平时推代码只跑检查，不浪费构建时间。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "手动构建的版本号（仅用于产物命名，不创建 Release）"
        required: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------ macOS
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 只构建 Apple Silicon。Intel runner（macos-13）已被 GitHub 列入退役计划，
        # 放进矩阵会让整个发布流程因「runner 不存在」而失败。
        # 需要 Intel 包时：本地在 Intel Mac 上跑 packages/macos/build.sh，
        # 或把下面的注释项解开并确认该 runner 仍然可用。
        include:
          - runner: macos-latest  # Apple Silicon，跟随当前受支持镜像
            arch: arm64
          # - runner: macos-13      # Intel（退役中，谨慎启用）
          #   arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements-dev.txt

      - name: 语法检查
        run: python -m compileall -q moshan

      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --clean --distpath dist --workpath build packages/moshan.spec

      - name: ad-hoc 签名
        run: |
          codesign --force --deep --sign - dist/Moshan.app || true
          codesign --verify --deep --strict --verbose=2 dist/Moshan.app || true

      # 这一步是本仓库唯一能验证「装到别人机器上到底能不能用」的地方。
      # 0.2.0 就是因为 CI 只构建、从不运行才发出去的：包里自带 OpenSSL 找不到
      # 系统 CA，安装版所有 https（含「检查更新」）全废，而构建日志一切正常。
      # 构建能过 ≠ 装完能跑，所以这里真的把 app 拉起来打一次接口。
      - name: 冒烟（安装版能起来 / 证书打进去了）
        run: |
          TMPH=$(mktemp -d); TMPM=$(mktemp -d)
          HOME="$TMPH" MOSHAN_HOME="$TMPM" MOSHAN_NO_BROWSER=1 \
            ./dist/Moshan.app/Contents/MacOS/Moshan >/dev/null 2>&1 &
          APP=$!
          trap 'kill $APP 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            [ -f "$TMPM/state/config.json" ] && break
            sleep 1
          done
          LOG="$TMPM/state/logs/moshan.log"
          echo "--- 启动日志 ---"; cat "$LOG" 2>/dev/null || true

          if ! grep -q "CA 证书：/" "$LOG" 2>/dev/null; then
            echo "::error::安装版没找到 CA 证书，所有 https 请求都会 CERTIFICATE_VERIFY_FAILED"
            exit 1
          fi

          P=$(python3 -c "import json;print(json.load(open('$TMPM/state/config.json'))['local_port'])")
          K=$(python3 -c "import json;print(json.load(open('$TMPM/state/config.json'))['token'])")
          CODE=000
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 3 -H "X-Token: $K" \
                     "http://127.0.0.1:$P/api/about" || true)
            [ "$CODE" = "200" ] && break
            sleep 1
          done
          echo "GET /api/about -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::安装版启动后接口不可用（进程起来不等于服务能响应）"
            exit 1
          fi
          echo "安装版冒烟通过：证书在位、服务可响应"

      - name: 读取版本
        id: ver
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' moshan/version.py | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 制作 dmg
        run: |
          V="${{ steps.ver.outputs.version }}"
          STAGE=$(mktemp -d)
          cp -R dist/Moshan.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Moshan ${V}" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/Moshan-${V}-macos-${{ matrix.arch }}.dmg"
          rm -rf "$STAGE"
          shasum -a 256 "dist/Moshan-${V}-macos-${{ matrix.arch }}.dmg" | awk '{print $1}' > "dist/dmg.sha256"
          cat "dist/dmg.sha256"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: moshan-macos-${{ matrix.arch }}
          path: |
            dist/Moshan-*-macos-${{ matrix.arch }}.dmg
            dist/dmg.sha256
          if-no-files-found: error

  # ------------------------------------------------------------ Windows
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 构建（含安装程序）
        shell: pwsh
        run: |
          $env:ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          ./packages/windows/build.ps1

      # 与 macOS 那边同一件事：把刚打出来的 exe 真跑一次。
      # Windows 上同样是自带 OpenSSL 找不到系统根证书，只构建不运行就发现不了。
      - name: 冒烟（安装版能起来 / 证书打进去了）
        shell: pwsh
        run: |
          $home2 = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "mhome")
          $state = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "mstate")
          $exe = Get-ChildItem dist -Recurse -Filter Moshan.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "找不到 Moshan.exe"; exit 1 }
          Write-Host "启动 $($exe.FullName)"

          $env:HOME = $home2.FullName
          $env:MOSHAN_HOME = $state.FullName
          $env:MOSHAN_NO_BROWSER = "1"
          $p = Start-Process -FilePath $exe.FullName -PassThru -WindowStyle Hidden

          $cfg = Join-Path $state.FullName "state\config.json"
          $log = Join-Path $state.FullName "state\logs\moshan.log"

          function Show-Diag {
            Write-Host "===== 启动日志（全量） ====="
            if (Test-Path $log) { Get-Content $log } else { Write-Host "(日志文件不存在：$log)" }
            Write-Host "===== config.json ====="
            if (Test-Path $cfg) { Get-Content $cfg -Raw } else { Write-Host "(不存在)" }
            Write-Host "===== 本进程监听端口 ====="
            netstat -ano | Select-String "LISTENING" | Select-String "\s$($p.Id)$"
            Write-Host "===== 进程状态 ====="
            $p.Refresh()
            if ($p.HasExited) { Write-Host "已退出，ExitCode=$($p.ExitCode)" } else { Write-Host "仍在运行 PID=$($p.Id)" }
          }

          # 判据：以「程序自己打印出来的那个本机地址」为准。launcher 就是把用户领到
          # 这个地址的，它不会响就等于用户装完打不开 —— 比猜某个固定端口可靠。
          $lport = $null
          for ($i = 0; $i -lt 60; $i++) {
            if (Test-Path $log) {
              $m = Select-String -Path $log -Pattern "口袋服务 http://127\.0\.0\.1:(\d+)" | Select-Object -First 1
              if ($m) { $lport = $m.Matches[0].Groups[1].Value; break }
            }
            $p.Refresh(); if ($p.HasExited) { break }
            Start-Sleep 1
          }

          if (-not $lport) {
            Show-Diag
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Error "安装版没起来（六十秒内没打印出本机访问地址）"
            exit 1
          }
          Write-Host "程序自报本机端口：$lport"

          if (-not (Select-String -Path $log -Pattern "CA 证书：." -Quiet)) {
            Show-Diag
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Error "安装版没找到 CA 证书，https 会 CERTIFICATE_VERIFY_FAILED"
            exit 1
          }

          $j = Get-Content $cfg -Raw | ConvertFrom-Json
          $url = "http://127.0.0.1:$lport/api/about"
          $code = "000"
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -Headers @{ "X-Token" = $j.token } -TimeoutSec 3 -UseBasicParsing
              $code = "$($r.StatusCode)"; if ($code -eq "200") { break }
            } catch { $code = "err" }
            Start-Sleep 1
          }
          Write-Host "GET $url -> $code"
          if ($code -ne "200") {
            Show-Diag
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Error "安装版启动后接口不可用"
            exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "安装版冒烟通过"

      - name: 输出校验值
        shell: pwsh
        run: |
          $f = Get-ChildItem dist\*-windows-x64-Setup.exe | Select-Object -First 1
          (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii dist\setup.sha256
          Get-Content dist\setup.sha256

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: moshan-windows-x64
          path: |
            dist/*-windows-x64-Setup.exe
            dist/setup.sha256
          if-no-files-found: error

  # ------------------------------------------------------------ Release
  release:
    name: 发布 Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成 release.json（供人工核对校验值）
        # 更新器不读这个文件 —— 它读 GitHub Releases API，校验值取每个资产的
        # digest 字段（与这里的 sha256 同源同值）。release.json 的作用是给
        # 「手动下载后想核对」的人一个稳定位置，不依赖 API 的字段变化。
        # 单独再发一个 dmg.sha256 附件没有意义，只会让 Release 目录更乱。
        run: |
          V="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path("artifacts")
          assets = {}
          for f in sorted(root.iterdir()):
              if not f.is_file():
                  continue
              low = f.name.lower()
              if low.endswith(".dmg"):
                  key = "macos-arm64" if "arm64" in low else "macos-x64"
              elif low.endswith(".exe"):
                  key = "windows-x64"
              else:
                  continue
              assets[key] = {
                  "name": f.name,
                  "size": f.stat().st_size,
                  "sha256": hashlib.sha256(f.read_bytes()).hexdigest(),
              }
          out = {
              # 存不带 v 的版本号：写 v0.2.0 的话，谁拿它跟 version.VERSION 比都会出岔子
              "version": os.environ["VERSION"].strip().lstrip("vV"),
              "min_from": "0.1.0",
              "assets": assets,
              "notes": "见 Release 说明",
          }
          pathlib.Path("artifacts/release.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
        env:
          VERSION: ${{ github.ref_name }}

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/release.json
          draft: false
          generate_release_notes: true
          body: |
            ## 安装

            下载与你的系统对应的文件：

            | 系统 | 文件 |
            |---|---|
            | macOS（Apple 芯片 M1/M2/M3/M4） | `Moshan-*-macos-arm64.dmg` |
            | macOS（Intel） | `Moshan-*-macos-x64.dmg` |
            | Windows 10/11 64 位 | `Moshan-*-windows-x64-Setup.exe` |

            **macOS 首次打开**：安装包没有 Apple 开发者签名，双击若提示「无法验证开发者」，
            请在「访达」里**右键点 Moshan → 打开**，或到「系统设置 → 隐私与安全性」点「仍要打开」。
            这是未签名应用的系统行为，不是安装包损坏。

            **更新不会丢数据**：程序装在应用目录，你的配置在
            `~/Library/Application Support/Moshan`，文件在 `~/Documents/Moshan`。
            覆盖安装只替换程序，另两个目录不动。

            ### 校验
            `release.json` 里有每个包的 sha256，可用 `shasum -a 256 <文件>` 核对。
