name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt

      - name: 自检（与本地 `bash scripts/check.sh` 同一套）
        # 检查逻辑只在 check.sh 里写一份。以前 CI 另抄一份、只抽查 8 个模块，
        # 于是「本地全绿、CI 全红」成了常态（2026-11-23 漏掉 textfmt.py 那次）。
        run: bash scripts/check.sh
