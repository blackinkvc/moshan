# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "moshan-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "墨山中台服务端（Rust 重写）。按波次替换 Python 实现，未迁路由转发给上游。"

[[bin]]
name = "moshan-server"
path = "src/main.rs"

# 迁移期把剩余波次做成「泳道」特性：每条泳道可单独编译、单独运行、单独对拍。
# 并行施工时，A 泳道的半成品不会挡住 B 泳道的 cargo check —— 否则任何一个文件
# 写坏都会让所有人停在同一条报错上。全部迁完后把这里删掉（或 default 置全开）。
[features]
# 全量默认：`cargo build --release` 出来的就是完整服务。
# 单条泳道仍可 `--no-default-features --features lane_xx` 单独编，
# 用于定位某条泳道的问题（不然任何一处编译错都会挡住所有人）。
default = [
    "lane_u",
    "lane_w4b",
    "lane_w4c",
    "lane_w5a",
    "lane_w5b",
    "lane_w5d",
    "lane_w5e",
    "lane_w6a",
    "lane_w6b",
    "lane_w7a",
    "lane_w7b",
]
lane_w4b = []
lane_w4c = []
lane_w5a = []
lane_w5b = []
lane_w5d = []
lane_w5e = []
lane_w6a = []
lane_w6b = []
lane_w7a = []
lane_w7b = []
lane_u = []

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde_json = { version = "1", features = ["preserve_order"] }
# 查询参数解析（`?path=` 含中文/空格时必须走 urlencoded 解码，与 FastAPI 同口径）。
serde = { version = "1", features = ["derive"] }
# 磁盘用量：statvfs 的 f_blocks/f_bfree/f_bavail 才是 `shutil.disk_usage` 的原始量，
# 自己读 df 会因为列宽/本地化解析出错。
libc = "0.2"
# 分享过期时间要按本地时区渲染成 "%m-%d %H:%M"，和 Python 的 time.localtime 一致。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 内联缩略图：缓存键是 sha1，内联体是 base64。键必须与 Python 逐字节一致，
# 否则两边各生成一份缓存，对拍时还会因为写盘让磁盘用量抖动。
sha1 = "0.10"
base64 = "0.22"
# 只需要 http/1.1，但**必须带 TLS**：账单拉取、文章抓取、更新检查全是 https，
# 少了 rustls 这些接口只能回「握手失败」，等于没迁。
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
# Python 侧大量用 re 做「从一段话里抠字段」，逐条译成正则字面量最稳，
# 手写字符扫描反而容易在边界（全角空格、中文标点、括号）上分叉。
regex = "1"
# 查询串里的 `%XX` 要按 UTF-8 还原；`?path=` 不能只解半截。
percent-encoding = "2"
# `/api/updates` 与 pack 校验要算 sha256（与 Python 的 hashlib 同结果）。
sha2 = "0.10"
